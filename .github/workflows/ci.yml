name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [18, 20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run test:run

  prettier-versions:
    name: Prettier ${{ matrix.prettier }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        prettier:
          - 3.0.3
          - 3.1.1
          - 3.2.5
          - 3.3.3
          - 3.4.2
          - 3.5.3
          - 3.6.2
          - 3.7.4
          - 3.8.5
          - 3.9.6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm install --no-save prettier@${{ matrix.prettier }}
      - run: npx prettier --version
      - run: npm run test:run
